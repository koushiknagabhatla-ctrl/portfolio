    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Koushik Nagabhatla",
      "url": "https://nrkportfolio.in/",
      "jobTitle": "Network Engineer",
      "knowsAbout": ["Computer Networking", "Cisco IOS", "Routing and Switching", "OSPF", "Network Security", "Web Development", "Full-Stack Engineering", "Photography"],

        "https://www.instagram.com/__.koushik__.7"
      ]
    }

    <!-- Critical CSS: covers the preloader + shell for zero-flash first paint -->
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      body{background-color:#fffdf1;color:#e56a44;font-family:'Inter',sans-serif;overflow-x:hidden;line-height:1.6}
      a{color:inherit;text-decoration:none}
      #root{min-height:100vh}
      .preloader-container{position:fixed;top:0;left:0;width:100vw;height:100vh;background-color:#fffdf1;z-index:999999}
      .navbar{display:flex;justify-content:space-between;align-items:center;padding:clamp(20px,2.5vh,32px) clamp(20px,5vw,60px);position:fixed;top:0;left:0;width:100%;z-index:1000}
    </style>
